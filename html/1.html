<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战 - Battle City</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.3);
            border: 3px solid #0f0;
            border-radius: 4px;
        }

        canvas {
            display: block;
            background: #000;
            image-rendering: pixelated;
        }

        .ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0f0;
            font-size: 14px;
            text-shadow: 0 0 10px #0f0;
            pointer-events: none;
            z-index: 10;
            line-height: 1.6;
        }

        .lives {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #0f0;
            font-size: 14px;
            text-shadow: 0 0 10px #0f0;
            pointer-events: none;
            z-index: 10;
        }

        /* 只保留这一个 enemy-count 定义，放在右上角LIVES下方 */
        /* 只保留这个 */
        .enemy-count {
            position: absolute;
            top: 35px;
            right: 10px;    /* 注意是 right 不是 left */
            color: #f00;
            font-size: 12px;
            text-shadow: 0 0 5px #f00;
        }

        .controls {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            color: #666;
            font-size: 12px;
            text-align: center;
            white-space: nowrap;
        }

        .controls span {
            color: #0f0;
            margin: 0 5px;
        }

        .game-over, .level-complete, .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #0f0;
            z-index: 20;
        }

        .game-over h2, .level-complete h2, .start-screen h2 {
            font-size: 36px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #0f0;
            animation: pulse 1.5s infinite;
        }

        .start-screen h2 {
            color: #ffd700;
            text-shadow: 0 0 20px #ffd700;
        }

        .btn {
            padding: 12px 30px;
            font-size: 18px;
            background: transparent;
            border: 2px solid #0f0;
            color: #0f0;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 20px #0f0;
        }

        .hidden {
            display: none !important;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .power-up-indicator {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #ffd700;
            font-size: 12px;
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="520" height="520"></canvas>
        
        <div class="ui-overlay">
            <div>SCORE: <span id="score">0</span></div>
            <div>LEVEL: <span id="level">1</span></div>
        </div>

        <div class="lives">♥ <span id="lives">3</span></div>
        <!-- 只保留这一个 enemy-count -->
        <div class="enemy-count">ENEMIES: <span id="enemyCount">0</span></div>
        <div id="powerUpText" class="power-up-indicator hidden">⚡ POWER UP!</div>
        
        <div class="controls">
            <span>↑↓←→</span> 移动 <span>SPACE</span> 射击 <span>P</span> 暂停
        </div>

        <div id="startScreen" class="start-screen">
            <h2>🎮 坦克大战</h2>
            <p style="margin-bottom: 10px; color: #888;">BATTLE CITY</p>
            <p style="font-size: 14px; color: #666; margin-bottom: 30px;">保卫基地，消灭所有敌人</p>
            <button class="btn" onclick="startGame()">开始游戏</button>
        </div>

        <div id="gameOverScreen" class="game-over hidden">
            <h2>游戏结束</h2>
            <p>最终得分: <span id="finalScore">0</span></p>
            <button class="btn" onclick="restartGame()">重新开始</button>
        </div>

        <div id="levelCompleteScreen" class="level-complete hidden">
            <h2>关卡完成!</h2>
            <p>准备进入下一关...</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 游戏配置
        const TILE_SIZE = 26;
        const MAP_WIDTH = 20;
        const MAP_HEIGHT = 20;
        
        // 游戏状态
        let gameState = 'start'; // start, playing, paused, gameover, levelComplete
        let score = 0;
        let level = 1;
        let lives = 3;
        let frameCount = 0;
        
        // 输入状态
        const keys = {};
        
        // 游戏对象
        let player;
        let enemies = [];
        let bullets = [];
        let particles = [];
        let powerUps = [];
        let map = [];
        let enemySpawnTimer = 0;
        let enemiesToSpawn = 0;
        let powerUpTimer = 0;
        
        // 方向常量
        const DIRECTION = {
            UP: 0,
            RIGHT: 1,
            DOWN: 2,
            LEFT: 3
        };
        
        // 地图元素类型
        const TILE = {
            EMPTY: 0,
            BRICK: 1,
            STEEL: 2,
            WATER: 3,
            GRASS: 4,
            BASE: 5
        };
        
        // 粒子效果类
        class Particle {
            constructor(x, y, color, speed = 2) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * speed * 2;
                this.vy = (Math.random() - 0.5) * speed * 2;
                this.life = 30;
                this.color = color;
                this.size = Math.random() * 3 + 1;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life--;
                this.size *= 0.95;
            }
            
            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.life / 30;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1;
            }
        }
        
        // 子弹类
        class Bullet {
            constructor(x, y, direction, isPlayer = false, power = 1) {
                this.x = x;
                this.y = y;
                this.direction = direction;
                this.speed = 6;
                this.isPlayer = isPlayer;
                this.power = power;
                this.width = 4;
                this.height = 4;
                this.active = true;
                
                // 根据方向调整位置
                if (direction === DIRECTION.UP) this.y -= 10;
                if (direction === DIRECTION.DOWN) this.y += 10;
                if (direction === DIRECTION.LEFT) this.x -= 10;
                if (direction === DIRECTION.RIGHT) this.x += 10;
            }
            
            update() {
                switch(this.direction) {
                    case DIRECTION.UP: this.y -= this.speed; break;
                    case DIRECTION.DOWN: this.y += this.speed; break;
                    case DIRECTION.LEFT: this.x -= this.speed; break;
                    case DIRECTION.RIGHT: this.x += this.speed; break;
                }
                
                // 检查边界
                if (this.x < 0 || this.x > canvas.width || 
                    this.y < 0 || this.y > canvas.height) {
                    this.active = false;
                    createExplosion(this.x, this.y, '#fff', 5);
                }
                
                this.checkCollision();
            }
            
            checkCollision() {
                const tileX = Math.floor(this.x / TILE_SIZE);
                const tileY = Math.floor(this.y / TILE_SIZE);
                
                // 检查地图碰撞
                if (tileX >= 0 && tileX < MAP_WIDTH && tileY >= 0 && tileY < MAP_HEIGHT) {
                    const tile = map[tileY][tileX];
                    
                    if (tile === TILE.BRICK) {
                        map[tileY][tileX] = TILE.EMPTY;
                        this.active = false;
                        createExplosion(this.x, this.y, '#d2691e', 8);
                        playSound('hit');
                    } else if (tile === TILE.STEEL) {
                        if (this.power >= 2) {
                            map[tileY][tileX] = TILE.EMPTY;
                            createExplosion(this.x, this.y, '#888', 8);
                        }
                        this.active = false;
                        createExplosion(this.x, this.y, '#fff', 5);
                        playSound('hit');
                    } else if (tile === TILE.BASE) {
                        gameOver();
                    }
                }
                
                // 检查与坦克的碰撞
                if (this.isPlayer) {
                    // 玩家子弹击中敌人
                    enemies.forEach(enemy => {
                        if (enemy.active && this.checkTankCollision(enemy)) {
                            enemy.hit();
                            this.active = false;
                        }
                    });
                } else {
                    // 敌人子弹击中玩家
                    if (player.active && this.checkTankCollision(player)) {
                        player.hit();
                        this.active = false;
                    }
                    
                    // 敌人子弹也击中其他敌人（自相残杀）
                    enemies.forEach(enemy => {
                        if (enemy.active && this.checkTankCollision(enemy)) {
                            enemy.hit();
                            this.active = false;
                        }
                    });
                }
            }
            
            checkTankCollision(tank) {
                return this.x > tank.x - tank.width/2 && 
                       this.x < tank.x + tank.width/2 &&
                       this.y > tank.y - tank.height/2 && 
                       this.y < tank.y + tank.height/2;
            }
            
            draw() {
                ctx.fillStyle = this.isPlayer ? '#ff0' : '#f00';
                ctx.fillRect(this.x - 2, this.y - 2, 4, 4);
                
                // 拖尾效果
                ctx.fillStyle = this.isPlayer ? 'rgba(255, 255, 0, 0.3)' : 'rgba(255, 0, 0, 0.3)';
                const offset = this.speed;
                switch(this.direction) {
                    case DIRECTION.UP: ctx.fillRect(this.x - 2, this.y, 4, offset); break;
                    case DIRECTION.DOWN: ctx.fillRect(this.x - 2, this.y - offset, 4, offset); break;
                    case DIRECTION.LEFT: ctx.fillRect(this.x, this.y - 2, offset, 4); break;
                    case DIRECTION.RIGHT: ctx.fillRect(this.x - offset, this.y - 2, offset, 4); break;
                }
            }
        }
        
        // 坦克基类
        class Tank {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.width = 24;
                this.height = 24;
                this.direction = DIRECTION.UP;
                this.speed = 2;
                this.color = color;
                this.active = true;
                this.moveTimer = 0;
                this.shootTimer = 0;
                this.blinkTimer = 0;
                this.invincible = false;
            }
            
            canMove(newX, newY) {
                // 边界检查
                if (newX < this.width/2 || newX > canvas.width - this.width/2 ||
                    newY < this.height/2 || newY > canvas.height - this.height/2) {
                    return false;
                }
                
                // 缩小碰撞盒避免卡墙
                const padding = 2;
                const corners = [
                    {x: newX - this.width/2 + padding, y: newY - this.height/2 + padding},
                    {x: newX + this.width/2 - padding, y: newY - this.height/2 + padding},
                    {x: newX - this.width/2 + padding, y: newY + this.height/2 - padding},
                    {x: newX + this.width/2 - padding, y: newY + this.height/2 - padding}
                ];
                
                for (let corner of corners) {
                    const tileX = Math.floor(corner.x / TILE_SIZE);
                    const tileY = Math.floor(corner.y / TILE_SIZE);
                    
                    if (tileX >= 0 && tileX < MAP_WIDTH && tileY >= 0 && tileY < MAP_HEIGHT) {
                        const tile = map[tileY][tileX];
                        if (tile === TILE.BRICK || tile === TILE.STEEL || tile === TILE.WATER) {
                            return false;
                        }
                    }
                }
                
                // 敌人之间不重叠
                if (this instanceof Enemy) {
                    for (let other of enemies) {
                        if (other !== this && other.active) {
                            const dx = newX - other.x;
                            const dy = newY - other.y;
                            if (Math.sqrt(dx*dx + dy*dy) < this.width) return false;
                        }
                    }
                    if (player.active) {
                        const dx = newX - player.x;
                        const dy = newY - player.y;
                        if (Math.sqrt(dx*dx + dy*dy) < this.width) return false;
                    }
                }
                
                return true;
            }
            
            move(direction) {
                this.direction = direction;
                let newX = this.x;
                let newY = this.y;
                
                switch(direction) {
                    case DIRECTION.UP: newY -= this.speed; break;
                    case DIRECTION.DOWN: newY += this.speed; break;
                    case DIRECTION.LEFT: newX -= this.speed; break;
                    case DIRECTION.RIGHT: newX += this.speed; break;
                }
                
                if (this.canMove(newX, newY)) {
                    this.x = newX;
                    this.y = newY;
                }
            }
            
            shoot() {
                if (this.shootTimer <= 0) {
                    bullets.push(new Bullet(this.x, this.y, this.direction, this instanceof Player));
                    this.shootTimer = 20;
                    playSound('shoot');
                }
            }
            
            hit() {
                if (this.invincible) return;
                
                createExplosion(this.x, this.y, this.color, 15);
                this.active = false;
                playSound('explosion');
            }
            
            draw() {
                if (!this.active) return;
                
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // 无敌闪烁效果
                if (this.invincible && Math.floor(this.blinkTimer / 5) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }
                
                // 旋转
                ctx.rotate(this.direction * Math.PI / 2);
                
                // 绘制坦克主体
                ctx.fillStyle = this.color;
                ctx.fillRect(-12, -12, 24, 24);
                
                // 履带
                ctx.fillStyle = '#333';
                ctx.fillRect(-12, -14, 24, 4);
                ctx.fillRect(-12, 10, 24, 4);
                
                // 炮塔
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(0, 0, 8, 0, Math.PI * 2);
                ctx.fill();
                
                // 炮管
                ctx.fillStyle = '#666';
                ctx.fillRect(-2, -20, 4, 12);
                
                // 细节
                ctx.fillStyle = '#000';
                ctx.fillRect(-4, -4, 8, 8);
                
                ctx.restore();
            }
            
            update() {
                if (this.shootTimer > 0) this.shootTimer--;
                if (this.invincible) {
                    this.blinkTimer++;
                    if (this.blinkTimer > 120) {
                        this.invincible = false;
                        this.blinkTimer = 0;
                    }
                }
            }
        }
        
        // 玩家类
        class Player extends Tank {
            constructor(x, y) {
                super(x, y, '#0f0');
                this.lives = 3;
                this.powerLevel = 1;
                this.speed = 2.5;
            }
            
            update() {
                super.update();
                
                if (!this.active) return;
                
                // 键盘控制
                if (keys['ArrowUp'] || keys['w']) this.move(DIRECTION.UP);
                else if (keys['ArrowDown'] || keys['s']) this.move(DIRECTION.DOWN);
                else if (keys['ArrowLeft'] || keys['a']) this.move(DIRECTION.LEFT);
                else if (keys['ArrowRight'] || keys['d']) this.move(DIRECTION.RIGHT);
                
                if (keys[' ']) this.shoot();
            }
            
            hit() {
                if (this.invincible) return;
                
                super.hit();
                lives--;
                updateUI();
                
                if (lives > 0) {
                    setTimeout(() => {
                        this.respawn();
                    }, 1000);
                } else {
                    gameOver();
                }
            }
            
            respawn() {
                this.x = 9 * TILE_SIZE + TILE_SIZE/2;
                this.y = 18 * TILE_SIZE + TILE_SIZE/2;
                this.direction = DIRECTION.UP;
                this.active = true;
                this.invincible = true;
                this.powerLevel = 1;
                this.speed = 2.5;
            }
            
            powerUp() {
                this.powerLevel = Math.min(this.powerLevel + 1, 3);
                this.speed = 2.5 + (this.powerLevel - 1) * 0.5;
                this.invincible = true;
                this.blinkTimer = 0;
                
                document.getElementById('powerUpText').classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('powerUpText').classList.add('hidden');
                }, 2000);
            }
        }
        
        // 敌人类
        class Enemy extends Tank {
        constructor(x, y, type = 'basic') {
            super(x, y, '#f00');
            this.type = type;
            this.moveTimer = 0;
            this.shootTimer = Math.random() * 60;
            this.changeDirTimer = 0;
            
            // 根据类型设置属性
            switch(type) {
                case 'fast':
                    this.speed = 3.5;
                    this.color = '#ff6600';
                    this.hp = 1;  // 添加hp初始化
                    break;
                case 'heavy':
                    this.speed = 1.5;
                    this.color = '#800080';
                    this.hp = 2;
                    break;
                case 'basic':
                default:
                    this.speed = 2;
                    this.color = '#f00';
                    this.hp = 1;  // 确保basic也有hp
                    break;
            }
        }
            
            update() {
                super.update();
                if (!this.active) return;
                
                // 确保changeDirTimer已初始化
                if (this.changeDirTimer === undefined) this.changeDirTimer = 0;
                
                this.changeDirTimer++;
                
                // 预检测移动
                let nextX = this.x, nextY = this.y;
                switch(this.direction) {
                    case DIRECTION.UP: nextY -= this.speed; break;
                    case DIRECTION.DOWN: nextY += this.speed; break;
                    case DIRECTION.LEFT: nextX -= this.speed; break;
                    case DIRECTION.RIGHT: nextX += this.speed; break;
                }
                
                // 撞墙或随机换向
                if (!this.canMove(nextX, nextY) || this.changeDirTimer > 60) {
                    const dirs = [];
                    for (let d = 0; d < 4; d++) {
                        let tx = this.x, ty = this.y;
                        switch(d) {
                            case DIRECTION.UP: ty -= this.speed; break;
                            case DIRECTION.DOWN: ty += this.speed; break;
                            case DIRECTION.LEFT: tx -= this.speed; break;
                            case DIRECTION.RIGHT: tx += this.speed; break;
                        }
                        if (this.canMove(tx, ty)) dirs.push(d);
                    }
                    
                    if (dirs.length > 0) {
                        if (player.active && Math.random() < 0.4) {
                            const dx = player.x - this.x;
                            const dy = player.y - this.y;
                            const prefer = Math.abs(dx) > Math.abs(dy) 
                                ? (dx > 0 ? DIRECTION.RIGHT : DIRECTION.LEFT)
                                : (dy > 0 ? DIRECTION.DOWN : DIRECTION.UP);
                            this.direction = dirs.includes(prefer) ? prefer : dirs[Math.floor(Math.random() * dirs.length)];
                        } else {
                            this.direction = dirs[Math.floor(Math.random() * dirs.length)];
                        }
                    }
                    this.changeDirTimer = 0;
                } else {
                    this.x = nextX;
                    this.y = nextY;
                }
                
                if (this.shootTimer-- <= 0 && Math.random() < 0.03) {
                    this.shoot();
                    this.shootTimer = 40;
                }
            }
            
            canMoveInDirection() {
                let testX = this.x;
                let testY = this.y;
                switch(this.direction) {
                    case DIRECTION.UP: testY -= this.speed; break;
                    case DIRECTION.DOWN: testY += this.speed; break;
                    case DIRECTION.LEFT: testX -= this.speed; break;
                    case DIRECTION.RIGHT: testX += this.speed; break;
                }
                return this.canMove(testX, testY);
            }
            
            hit() {
                this.hp--;
                if (this.hp <= 0) {
                    super.hit();
                    score += (this.type === 'heavy' ? 300 : this.type === 'fast' ? 200 : 100);
                    updateUI();
                    
                    // 随机掉落道具
                    if (Math.random() < 0.15) {
                        spawnPowerUp(this.x, this.y);
                    }
                } else {
                    createExplosion(this.x, this.y, '#fff', 5);
                }
            }
        }
        
        // 道具类
        class PowerUp {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.type = Math.random() < 0.5 ? 'life' : 'power';
                this.active = true;
                this.timer = 600; // 10秒后消失
            }
            
            update() {
                this.timer--;
                if (this.timer <= 0) this.active = false;
                
                // 检查玩家拾取
                const dx = this.x - player.x;
                const dy = this.y - player.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist < 20 && player.active) {
                    if (this.type === 'life') {
                        lives++;
                        score += 500;
                    } else {
                        player.powerUp();
                        score += 300;
                    }
                    this.active = false;
                    updateUI();
                    playSound('powerup');
                }
            }
            
            draw() {
                if (!this.active) return;
                
                const blink = Math.floor(this.timer / 10) % 2 === 0;
                ctx.globalAlpha = blink ? 1 : 0.5;
                
                // 背景
                ctx.fillStyle = '#000';
                ctx.fillRect(this.x - 10, this.y - 10, 20, 20);
                ctx.strokeStyle = this.type === 'life' ? '#f00' : '#ffd700';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x - 10, this.y - 10, 20, 20);
                
                // 图标
                ctx.fillStyle = this.type === 'life' ? '#f00' : '#ffd700';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.type === 'life' ? '♥' : '⚡', this.x, this.y);
                
                ctx.globalAlpha = 1;
            }
        }
        
        // 生成地图
        // 在 generateMap 函数中，添加出生点保护
        function generateMap() {
            map = [];
            for (let y = 0; y < MAP_HEIGHT; y++) {
                map[y] = [];
                for (let x = 0; x < MAP_WIDTH; x++) {
                    // 边界墙
                    if (x === 0 || x === MAP_WIDTH - 1 || y === 0 || y === MAP_HEIGHT - 1) {
                        map[y][x] = TILE.STEEL;
                    }
                    // 出生点保护 (y=1, x=1,9,18)
                    else if (y === 1 && (x === 1 || x === 9 || x === 18)) {
                        map[y][x] = TILE.EMPTY;
                    }
                    // 基地保护
                    else if (x >= 8 && x <= 11 && y >= 17 && y <= 19) {
                        if (x === 9 || x === 10) {
                            if (y === 19) map[y][x] = TILE.BASE;
                            else map[y][x] = TILE.EMPTY;
                        } else {
                            map[y][x] = TILE.BRICK;
                        }
                    }
                    // 随机生成障碍物（避开出生点周围）
                    else if (Math.random() < 0.15 && !(x > 6 && x < 13 && y > 14) && y > 2) {
                        const rand = Math.random();
                        if (rand < 0.6) map[y][x] = TILE.BRICK;
                        else if (rand < 0.8) map[y][x] = TILE.STEEL;
                        else if (rand < 0.9) map[y][x] = TILE.WATER;
                        else map[y][x] = TILE.GRASS;
                    } else {
                        map[y][x] = TILE.EMPTY;
                    }
                }
            }
        }
        
        // 绘制地图
        function drawMap() {
            for (let y = 0; y < MAP_HEIGHT; y++) {
                for (let x = 0; x < MAP_WIDTH; x++) {
                    const tile = map[y][x];
                    const px = x * TILE_SIZE;
                    const py = y * TILE_SIZE;
                    
                    switch(tile) {
                        case TILE.BRICK:
                            ctx.fillStyle = '#d2691e';
                            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                            ctx.strokeStyle = '#8b4513';
                            ctx.lineWidth = 1;
                            ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
                            // 砖块纹理
                            ctx.beginPath();
                            ctx.moveTo(px + TILE_SIZE/2, py);
                            ctx.lineTo(px + TILE_SIZE/2, py + TILE_SIZE);
                            ctx.moveTo(px, py + TILE_SIZE/2);
                            ctx.lineTo(px + TILE_SIZE, py + TILE_SIZE/2);
                            ctx.stroke();
                            break;
                            
                        case TILE.STEEL:
                            ctx.fillStyle = '#888';
                            ctx.fillRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                            ctx.strokeStyle = '#fff';
                            ctx.lineWidth = 2;
                            ctx.strokeRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                            break;
                            
                        case TILE.WATER:
                            ctx.fillStyle = '#4169e1';
                            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                            // 水波纹效果
                            ctx.fillStyle = '#87ceeb';
                            const wave = Math.sin(frameCount * 0.1 + x + y) * 3;
                            ctx.fillRect(px + 5, py + 8 + wave, TILE_SIZE - 10, 4);
                            break;
                            
                        case TILE.GRASS:
                            ctx.fillStyle = '#228b22';
                            for (let i = 0; i < 5; i++) {
                                const gx = px + 5 + i * 4;
                                const gy = py + 5 + Math.sin(frameCount * 0.1 + i) * 2;
                                ctx.fillRect(gx, gy, 3, 15);
                            }
                            break;
                            
                        case TILE.BASE:
                            // 绘制基地（鹰）
                            ctx.fillStyle = '#ffd700';
                            ctx.beginPath();
                            ctx.moveTo(px + TILE_SIZE/2, py + 5);
                            ctx.lineTo(px + TILE_SIZE - 5, py + TILE_SIZE - 5);
                            ctx.lineTo(px + 5, py + TILE_SIZE - 5);
                            ctx.closePath();
                            ctx.fill();
                            ctx.strokeStyle = '#ff0';
                            ctx.lineWidth = 2;
                            ctx.stroke();
                            break;
                    }
                }
            }
        }
        
        // 生成敌人
        function spawnEnemy() {
            if (enemiesToSpawn <= 0) return;
            
            const spawnPoints = [1, 9, 18];
            const availablePoints = [];
            
            for (let spawnX of spawnPoints) {
                // 修正：出生点在第1行（y=1），中心坐标是 1*26 + 13 = 39
                const x = spawnX * TILE_SIZE + TILE_SIZE/2;
                const y = 1 * TILE_SIZE + TILE_SIZE/2;  // 第1行，不是第0行
                
                const tileX = Math.floor(x / TILE_SIZE);
                const tileY = Math.floor(y / TILE_SIZE);
                const tile = map[tileY] && map[tileY][tileX];
                
                if (tile === TILE.EMPTY) {
                    let occupied = false;
                    enemies.forEach(e => {
                        if (e.active && Math.abs(e.x - x) < 30 && Math.abs(e.y - y) < 30) {
                            occupied = true;
                        }
                    });
                    if (!occupied) availablePoints.push(spawnX);
                }
            }
            
            if (availablePoints.length === 0) return;
            
            const spawnX = availablePoints[Math.floor(Math.random() * availablePoints.length)];
            const x = spawnX * TILE_SIZE + TILE_SIZE/2;
            const y = 1 * TILE_SIZE + TILE_SIZE/2;  // 修正y坐标
            
            const types = ['basic', 'basic', 'fast', 'heavy'];
            const type = types[Math.floor(Math.random() * types.length)];
            enemies.push(new Enemy(x, y, type));
            enemiesToSpawn--;
        }
        
        // 生成道具
        function spawnPowerUp(x, y) {
            powerUps.push(new PowerUp(x, y));
        }
        
        // 创建爆炸效果
        function createExplosion(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }
        
        // 音效模拟（视觉反馈）
        function playSound(type) {
            // 实际项目中这里可以播放音频
            // 现在用视觉反馈代替
        }
        
        // 更新UI
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('lives').textContent = lives;
            document.getElementById('enemyCount').textContent = enemies.filter(e => e.active).length + enemiesToSpawn;
        }
        
        // 初始化游戏
        function initGame() {
            generateMap();
            player = new Player(9 * TILE_SIZE + TILE_SIZE/2, 18 * TILE_SIZE + TILE_SIZE/2);
            enemies = [];
            bullets = [];
            particles = [];
            powerUps = [];
            enemiesToSpawn = 4 + level * 2;
            score = 0;
            lives = 3;
            level = 1;
            updateUI();
        }
        
        // 开始游戏
        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            gameState = 'playing';
            initGame();
            gameLoop();
        }
        
        // 重新开始
        function restartGame() {
            document.getElementById('gameOverScreen').classList.add('hidden');
            gameState = 'playing';
            initGame();
        }
        
        // 游戏结束
        function gameOver() {
            gameState = 'gameover';
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }
        
        // 下一关
        function nextLevel() {
            gameState = 'levelComplete';
            document.getElementById('levelCompleteScreen').classList.remove('hidden');
            
            setTimeout(() => {
                level++;
                generateMap();
                player.respawn();
                enemies = [];
                bullets = [];
                particles = [];
                powerUps = [];
                enemiesToSpawn = 4 + level * 2;
                document.getElementById('levelCompleteScreen').classList.add('hidden');
                gameState = 'playing';
            }, 2000);
        }
        
        // 游戏主循环
        function gameLoop() {
            if (gameState !== 'playing') {
                if (gameState === 'playing') requestAnimationFrame(gameLoop);
                return;
            }
            
            frameCount++;
            
            // 清空画布
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制地图（先绘制地面层）
            drawMap();
            
            // 生成敌人
            enemySpawnTimer++;
            if (enemySpawnTimer > 120 && enemiesToSpawn > 0) {
                spawnEnemy();
                enemySpawnTimer = 0;
            }
            
            // 更新和绘制道具
            powerUps = powerUps.filter(p => p.active);
            powerUps.forEach(p => {
                p.update();
                p.draw();
            });
            
            // 更新和绘制玩家
            if (player.active) {
                player.update();
                player.draw();
            }
            
            // 更新和绘制敌人
            enemies = enemies.filter(e => e.active);
            enemies.forEach(enemy => {
                enemy.update();
                enemy.draw();
            });
            
            // 检查胜利条件
            if (enemiesToSpawn === 0 && enemies.length === 0) {
                nextLevel();
            }
            
            // 更新和绘制子弹
            bullets = bullets.filter(b => b.active);
            bullets.forEach(bullet => {
                bullet.update();
                bullet.draw();
            });
            
            // 更新和绘制粒子
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            // 重新绘制草丛（覆盖坦克）
            for (let y = 0; y < MAP_HEIGHT; y++) {
                for (let x = 0; x < MAP_WIDTH; x++) {
                    if (map[y][x] === TILE.GRASS) {
                        const px = x * TILE_SIZE;
                        const py = y * TILE_SIZE;
                        ctx.fillStyle = '#228b22';
                        for (let i = 0; i < 5; i++) {
                            const gx = px + 5 + i * 4;
                            const gy = py + 5 + Math.sin(frameCount * 0.1 + i) * 2;
                            ctx.fillRect(gx, gy, 3, 15);
                        }
                    }
                }
            }
            
            updateUI();
            requestAnimationFrame(gameLoop);
        }
        
        // 键盘事件
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            if (e.key === 'p' || e.key === 'P') {
                if (gameState === 'playing') {
                    gameState = 'paused';
                } else if (gameState === 'paused') {
                    gameState = 'playing';
                    gameLoop();
                }
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // 防止方向键滚动页面
        window.addEventListener('keydown', (e) => {
            if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(e.code) > -1) {
                e.preventDefault();
            }
        });
    </script>
